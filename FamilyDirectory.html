<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Directory - Perayil Kudumbam</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5efe3;
      --warm-white: #faf7f2;
      --sand: #e8d9bc;
      --gold: #b8913a;
      --gold-light: #d4a855;
      --gold-dark: #8a6a25;
      --deep-brown: #2c1810;
      --text-dark: #1e1008;
      --text-mid: #4a2e1a;
      --text-light: #7a5c3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--warm-white);
      color: var(--text-dark);
      font-family: 'Crimson Pro', Georgia, serif;
    }

    /* ── HEADER / NAV ── */
    header {
      background: var(--deep-brown);
      padding: 3rem 2rem 5rem;
      text-align: center;
      position: relative;
    }
    
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--gold-light);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,239,227,0.65);
      text-decoration: none;
      transition: color 0.25s;
    }
    .nav-links a.active, .nav-links a:hover { color: var(--gold-light); }

    .header-eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.1;
    }

    /* ── DIRECTORY MAIN ── */
    main {
      padding: 0 2rem 6rem;
      max-width: 1200px;
      margin: -3rem auto 0;
      position: relative;
      z-index: 10;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .directory-card {
      background: var(--cream);
      border: 1px solid rgba(184,145,58,0.2);
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 160px;
    }
    .directory-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(44,24,16,0.1);
      border-color: var(--gold);
    }
    
    .card-number {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: rgba(184,145,58,0.5);
      margin-bottom: 1rem;
    }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.3;
    }
    
    .card-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      opacity: 0.3;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--deep-brown);
      padding: 3rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(245,239,227,0.3);
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-inner">
      <a href="perayil.html" class="nav-logo">Perayil Kudumbam</a>
      <ul class="nav-links">
        <li><a href="perayil.html#home">Home</a></li>
        <li><a href="perayil.html#history">History</a></li>
        <li><a href="FamilyTree.html">Family Tree</a></li>
        <li><a href="perayil.html#memories">Photo Album</a></li>
        <li><a href="FamilyDirectory.html" class="active">Directory</a></li>
        <li><a href="perayil.html#champakulam">Champakulam</a></li>
      </ul>
    </div>
    
    <p class="header-eyebrow">Living Record</p>
    <h1 class="header-title">The Family<br>Directory</h1>
  </header>

  <main>
    <div class="directory-grid">
      <!-- Generated 38 cards based on old HTML -->
    </div>
  </main>

  <footer>
    <p>© Perayil Kudumbam · Kept with Love</p>
  </footer>

  <script>
    const families = [
      "Theramma & Oommachan", "Kuttappan & Animma", "Babichan & Valsamma",
      "Lillykutty & Mathachan", "Lusamma & Josukutty", "Salimma & Thankachan",
      "Thankachan & Tensy", "Joy & Monimma", "Leelamma & Kuttappan",
      "Sunnichan & Mariyamma", "Lisamma & Georgekutty", "Ansamma & Tomichan",
      "Monichan & Sillimma", "Moly & Kuriachan", "Rosamma & Jose",
      "Akkamma & Sojan", "Lalichan & Thankamma", "Sherly & Kunjumon",
      "Roobichan & Reji", "Kunjumon & Kochurani", "Aniyankunju & Shibi",
      "Rani & Babichan", "Ammini & Raju", "Mariyamma & Jolychan",
      "Jiji & Martin", "Jojo & Genoj", "Joji & Meena", "Sunnimon & Lisamma",
      "Selin & Babu", "Shancy & Tomichan", "Joshy & Jasmin",
      "Lalichan & Lisamma", "Santhosh & Sherly", "Lalimma & Sibichan",
      "Jis & Anup", "Julie & Joji", "Juno & Jagadeesh", "Jesmy & Roy"
    ];

    const grid = document.querySelector('.directory-grid');
    
    families.forEach((family, index) => {
      const card = document.createElement('div');
      card.className = 'directory-card';
      card.innerHTML = `
        <div class="card-icon">🏠</div>
        <div class="card-number">No. 0${index + 1}</div>
        <div class="card-name">${family}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
